AllCops:
  TargetRubyVersion: 3.3
  ExtraDetails: true
  NewCops: enable
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: true

Style/DateTime:
  Enabled: true

Layout/LineLength:
  Max: 100
  Exclude:
    - spec/**/*

Metrics/MethodLength:
  Max: 15
  Exclude:
    - lib/**/*

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - "*.gemspec"

Metrics/AbcSize:
  Exclude:
    - lib/**/*
    - spec/**/*

Metrics/CyclomaticComplexity:
  Exclude:
    - lib/**/*

Metrics/PerceivedComplexity:
  Exclude:
    - lib/**/*

Metrics/ModuleLength:
  Exclude:
    - spec/**/*

Layout/DotPosition:
  Enabled: true
  EnforcedStyle: leading

Style/HashSyntax:
  Enabled: true

Style/Documentation:
  Exclude:
    - lib/**/*
    - spec/**/*

Naming/FileName:
  Exclude:
    - lib/sidekiq-bus.rb

Lint/RescueException:
  Exclude:
    - lib/**/*

Gemspec/DevelopmentDependencies:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Exclude:
    - spec/**/*

Lint/SuppressedException:
  Exclude:
    - spec/**/*

Lint/EmptyClass:
  Exclude:
    - spec/**/*

Lint/EmptyBlock:
  Exclude:
    - spec/**/*
